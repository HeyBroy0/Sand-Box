<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Actions workflow runtime breakdown</title>
  <desc id="desc">One successful Sand-Box file-pipeline run. The overall job lasted approximately eight seconds. Individual step durations are reported with whole-second timestamp precision.</desc>
  <rect width="1160" height="720" fill="#ffffff"/>
