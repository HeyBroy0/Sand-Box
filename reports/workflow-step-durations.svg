  <text x="54" y="91" font-family="Arial, sans-serif" font-size="15" fill="#596579">Sand-Box · file-pipeline test · run #1 · success · 16 Nov 2026</text>
  <rect x="54" y="116" width="1052" height="78" rx="12" fill="#f2f5f9"/>
  <text x="78" y="149" font-family="Arial, sans-serif" font-size="14" fill="#596579">Total job elapsed time</text>
  <text x="78" y="177" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">~8 seconds</text>
