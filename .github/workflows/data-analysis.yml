name: Dataset analysis

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: Existing repository-relative CSV, TSV, JSON, JSONL, NDJSON, XLSX, or XLS file under data/
        required: true
        default: ""
        type: string
      target_column:
        description: Optional numeric outcome column for exploratory OLS
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-analysis.txt

      - name: Install analysis libraries
        run: python -m pip install -r requirements-analysis.txt

      - name: Validate input path
        env:
          INPUT_PATH: ${{ inputs.input_path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["INPUT_PATH"])
          if not path.parts or path.is_absolute() or ".." in path.parts:
              raise SystemExit("Input must be a repository-relative path under data/.")
          data_root = Path("data").resolve(strict=True)
          resolved = path.resolve(strict=True)
          if data_root not in resolved.parents or not resolved.is_file():
              raise SystemExit("Input must be an existing file inside data/.")
          print(f"Using input: {resolved.relative_to(Path.cwd())}")
          PY

      - name: Run exploratory analysis
        env:
          INPUT_PATH: ${{ inputs.input_path }}
          TARGET_COLUMN: ${{ inputs.target_column }}
        run: |
          args=(--input "$INPUT_PATH" --output-dir analysis-output)
          if [ -n "$TARGET_COLUMN" ]; then
            args+=(--target-column "$TARGET_COLUMN")
          fi
          python scripts/analyze_dataset.py "${args[@]}"

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: dataset-analysis-results
          path: analysis-output/
          if-no-files-found: error
          retention-days: 7
