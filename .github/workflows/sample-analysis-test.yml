name: Sample dataset analysis test

on:
  push:
    branches:
      - main
    paths:
      - sandbox-test/analysis-trigger.txt

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-analysis.txt

      - name: Install analysis libraries
        run: python -m pip install -r requirements-analysis.txt

      - name: Run exploratory analysis
        run: |
          python scripts/analyze_dataset.py \
            --input data/example.csv \
            --output-dir analysis-output \
            --target-column exam_score

      - name: Validate expected outputs
        run: |
          test -s analysis-output/report.md
          test -s analysis-output/descriptive_statistics.csv
          test -s analysis-output/missingness.csv
          test -s analysis-output/pearson_correlations.csv
          test -s analysis-output/ols_coefficients.csv
          test -s analysis-output/ols_summary.txt
          test -s analysis-output/correlation_matrix.png
          test -s analysis-output/metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("analysis-output/metadata.json").read_text())
          assert metadata["rows"] == 15, metadata
          assert metadata["columns"] == 4, metadata
          assert metadata["missing_cells"] == 0, metadata
          print("Validated 15 rows, 4 columns, and no missing cells.")
          PY

      - name: Upload analysis report and figures
        uses: actions/upload-artifact@v4
        with:
          name: sample-dataset-analysis
          path: analysis-output/
          if-no-files-found: error
          retention-days: 3
