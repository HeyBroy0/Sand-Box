name: Clean workflows

on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: Confirm deletion of selected completed runs and their artifacts
        required: true
        default: false
        type: boolean
      keep_recent_runs:
        description: Number of newest completed runs to keep across the repository
        required: true
        default: 0
        type: number
      confirm_branch_cleanup:
        description: Separately confirm deletion of unprotected branches outside archive/ and protect/
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete completed workflow runs and their artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_CLEANUP: ${{ inputs.confirm_cleanup }}
          KEEP_RECENT_RUNS: ${{ inputs.keep_recent_runs }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CONFIRM_CLEANUP" != "true" ]]; then
            echo "Run cleanup not confirmed; nothing was deleted."
            exit 0
          fi

          if ! [[ "$KEEP_RECENT_RUNS" =~ ^[0-9]+$ ]]; then
            echo "keep_recent_runs must be a non-negative whole number."
            exit 1
          fi

          run_ids_text="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100&sort=created&direction=desc" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id')"

          completed_run_ids=()
          if [[ -n "$run_ids_text" ]]; then
            mapfile -t completed_run_ids <<< "$run_ids_text"
          fi

          total=${#completed_run_ids[@]}
          keep=$((KEEP_RECENT_RUNS))
          echo "Found $total completed runs; keeping the newest $keep."

          if (( total <= keep )); then
            echo "Nothing to delete."
            exit 0
          fi

          deleted=0
          for ((i=keep; i<total; i++)); do
            run_id="${completed_run_ids[$i]}"
            if [[ "$run_id" == "$CURRENT_RUN_ID" ]]; then
              echo "Skipping this cleanup run: $run_id"
              continue
            fi

            echo "Deleting completed run $run_id and its associated artifacts."
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id"
            ((deleted+=1))
          done

          echo "Deleted $deleted completed workflow run(s)."
          echo "GitHub removes each deleted run's associated artifacts as well."

      - name: Delete unretained branches
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_BRANCH_CLEANUP: ${{ inputs.confirm_branch_cleanup }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CONFIRM_BRANCH_CLEANUP" != "true" ]]; then
            echo "Branch cleanup not confirmed; no branches were deleted."
            exit 0
          fi

          branch_names_text="$(gh api --paginate --jq '.[].name' \
            "repos/${GITHUB_REPOSITORY}/branches?per_page=100")"
          protected_text="$(gh api --paginate --jq '.[] | select(.protected == true) | .name' \
            "repos/${GITHUB_REPOSITORY}/branches?per_page=100")"
          open_pr_heads_text="$(gh api --paginate --jq \
            '.[] | select(.head.repo != null and .head.repo.full_name == env.GITHUB_REPOSITORY) | .head.ref' \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100")"
          open_pr_bases_text="$(gh api --paginate --jq '.[].base.ref' \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100")"

          branch_names=()
          protected_branches=()
          open_pr_heads=()
          open_pr_bases=()
          [[ -z "$branch_names_text" ]] || mapfile -t branch_names <<< "$branch_names_text"
          [[ -z "$protected_text" ]] || mapfile -t protected_branches <<< "$protected_text"
          [[ -z "$open_pr_heads_text" ]] || mapfile -t open_pr_heads <<< "$open_pr_heads_text"
          [[ -z "$open_pr_bases_text" ]] || mapfile -t open_pr_bases <<< "$open_pr_bases_text"

          contains_branch() {
            local needle="$1"
            local candidates="$2"
            [[ -n "$candidates" ]] && grep -Fqx -- "$needle" <<< "$candidates"
          }

          deleted=0
          kept=0
          for branch in "${branch_names[@]}"; do
            if [[ "$branch" == "$DEFAULT_BRANCH" || "$branch" == archive/* || "$branch" == protect/* ]]; then
              echo "Keeping reserved branch: $branch"
              ((kept+=1))
              continue
            fi
            if contains_branch "$branch" "$protected_text" || \
              contains_branch "$branch" "$open_pr_heads_text" || \
              contains_branch "$branch" "$open_pr_bases_text"; then
              echo "Keeping protected or active-PR branch: $branch"
              ((kept+=1))
              continue
            fi

            encoded_branch="$(jq -rn --arg value "$branch" '$value | @uri')"
            echo "Deleting unretained branch: $branch"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_branch}"
            ((deleted+=1))
          done

          echo "Branch cleanup complete: deleted $deleted; kept $kept."
