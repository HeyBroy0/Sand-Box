name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile reusable scripts
        run: |
          python -m py_compile \
            scripts/find_tool.py \
            scripts/export_docx.py \
            scripts/export_file.py \
            scripts/zip_archive.py \
            scripts/analyze_dataset.py

      - name: Validate tool catalog
        run: python scripts/find_tool.py --validate

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
