name: Tests

on:
  pull_request:
    branches:
      - T-brnch-1
  push:
    branches:
      - T-brnch-1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile reusable scripts
        run: |
          python -m py_compile \
            capabilities/scripts/find_tool.py \
            capabilities/scripts/export_docx.py \
            capabilities/scripts/export_file.py \
            capabilities/scripts/zip_archive.py \
            capabilities/scripts/analyze_dataset.py

      - name: Validate tool catalog
        run: python capabilities/scripts/find_tool.py --validate

      - name: Run unit tests
        run: python -m unittest discover -s capabilities/tests -v
