name: Library file handoff

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: Single repository file to stage (must be inside data/)
        required: true
        default: data/Summary.docx
        type: string

permissions:
  contents: read

jobs:
  handoff:
    name: Validate and prepare file artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository tests
        run: python -m unittest discover -s capabilities/tests -v

      - name: Validate, copy, and hash the selected file
        env:
          SOURCE_PATH: ${{ github.event.inputs.source_path || 'data/Summary.docx' }}
        run: |
          python capabilities/scripts/export_file.py --input "$SOURCE_PATH" --output-dir library-handoff

      - name: Upload one-day handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: library-handoff-${{ github.run_id }}
          path: library-handoff/
          if-no-files-found: error
          retention-days: 1
