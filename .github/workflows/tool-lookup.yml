name: Tool lookup

on:
  workflow_dispatch:
    inputs:
      query:
        description: Search names, summaries, tags, aliases, or entrypoint paths (blank lists all)
        required: false
        default: ""
        type: string
      kind:
        description: Entry point kind from the catalog, or all
        required: true
        default: all
        type: choice
        options:
          - all
          - script
          - workflow
      tags:
        description: Optional comma-separated tags; every tag must match
        required: false
        default: ""
        type: string
      limit:
        description: Maximum number of results (1–50)
        required: true
        default: 5
        type: number
      output_format:
        description: Text for people or JSON for agents
        required: true
        default: text
        type: choice
        options:
          - text
          - json

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate catalog and resolve matching tools
        env:
          QUERY: ${{ inputs.query }}
          KIND: ${{ inputs.kind }}
          TAGS: ${{ inputs.tags }}
          LIMIT: ${{ inputs.limit }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
        shell: bash
        run: |
          set -euo pipefail
          python capabilities/scripts/find_tool.py --validate
          args=(--kind "$KIND" --limit "$LIMIT" --format "$OUTPUT_FORMAT")
          if [[ -n "$QUERY" ]]; then
            args+=("$QUERY")
          fi
          if [[ -n "$TAGS" ]]; then
            IFS=',' read -ra tag_values <<< "$TAGS"
            for raw_tag in "${tag_values[@]}"; do
              tag="${raw_tag//[[:space:]]/}"
              if [[ -n "$tag" ]]; then
                args+=(--tag "$tag")
              fi
            done
          fi
          printf '## Tool lookup\n\n' >> "$GITHUB_STEP_SUMMARY"
          python capabilities/scripts/find_tool.py "${args[@]}" | tee /tmp/tool-results.txt
          cat /tmp/tool-results.txt >> "$GITHUB_STEP_SUMMARY"
