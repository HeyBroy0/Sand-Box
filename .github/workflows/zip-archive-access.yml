name: ZIP archive access

on:
  workflow_dispatch:
    inputs:
      archive_path:
        description: Repository-relative ZIP archive under data/
        required: true
        default: ""
        type: string
      operation:
        description: List contents, find candidate files, or extract one selected member
        required: true
        default: list
        type: choice
        options:
          - list
          - find
          - extract
      query:
        description: Optional partial filename/path query (required for find; extract query must be unique)
        required: false
        default: ""
        type: string
      member_path:
        description: Exact archive member path for extraction
        required: false
        default: ""
        type: string
      pattern:
        description: Optional case-insensitive glob, such as '*.pdf'
        required: false
        default: ""
        type: string
      extension:
        description: Optional extension filter, such as pdf
        required: false
        default: ""
        type: string
      limit:
        description: Maximum inventory/search results (1–500)
        required: true
        default: 100
        type: number
      max_member_mb:
        description: Maximum extracted file size in MiB (1–500)
        required: true
        default: 100
        type: number

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate inputs and run archive operation
        env:
          ARCHIVE_PATH: ${{ inputs.archive_path }}
          OPERATION: ${{ inputs.operation }}
          QUERY: ${{ inputs.query }}
          MEMBER_PATH: ${{ inputs.member_path }}
          PATTERN: ${{ inputs.pattern }}
          EXTENSION: ${{ inputs.extension }}
          LIMIT: ${{ inputs.limit }}
          MAX_MEMBER_MB: ${{ inputs.max_member_mb }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]] || (( LIMIT < 1 || LIMIT > 500 )); then
            echo "limit must be between 1 and 500." >&2
            exit 1
          fi
          if ! [[ "$MAX_MEMBER_MB" =~ ^[0-9]+$ ]] || (( MAX_MEMBER_MB < 1 || MAX_MEMBER_MB > 500 )); then
            echo "max_member_mb must be between 1 and 500." >&2
            exit 1
          fi
          mkdir -p zip-output
          case "$OPERATION" in
            list)
              args=(list --archive "$ARCHIVE_PATH" --limit "$LIMIT" --report zip-output/report.json)
              [[ -z "$QUERY" ]] || args+=(--query "$QUERY")
              [[ -z "$PATTERN" ]] || args+=(--pattern "$PATTERN")
              [[ -z "$EXTENSION" ]] || args+=(--extension "$EXTENSION")
              ;;
            find)
              if [[ -z "$QUERY" && -z "$PATTERN" && -z "$EXTENSION" ]]; then
                echo "find requires a query, pattern, or extension." >&2
                exit 1
              fi
              args=(find --archive "$ARCHIVE_PATH" --limit "$LIMIT" --report zip-output/report.json)
              [[ -z "$QUERY" ]] || args+=(--query "$QUERY")
              [[ -z "$PATTERN" ]] || args+=(--pattern "$PATTERN")
              [[ -z "$EXTENSION" ]] || args+=(--extension "$EXTENSION")
              ;;
            extract)
              args=(extract --archive "$ARCHIVE_PATH" --output-dir zip-output/extracted \
                --max-bytes "$((MAX_MEMBER_MB * 1024 * 1024))" --report zip-output/report.json)
              if [[ -n "$MEMBER_PATH" && -n "$QUERY" ]]; then
                echo "Set either member_path or query for extract, not both." >&2
                exit 1
              elif [[ -n "$MEMBER_PATH" ]]; then
                args+=(--member "$MEMBER_PATH")
              elif [[ -n "$QUERY" ]]; then
                args+=(--query "$QUERY")
              else
                echo "extract requires member_path or a query that identifies one unique file." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unknown operation: $OPERATION" >&2
              exit 1
              ;;
          esac
          python capabilities/scripts/zip_archive.py "${args[@]}" | tee /tmp/archive-results.txt
          {
            echo "## ZIP archive access"
            echo
            cat /tmp/archive-results.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inventory or extracted file
        uses: actions/upload-artifact@v4
        with:
          name: zip-archive-results-${{ github.run_id }}
          path: zip-output/
          if-no-files-found: error
          retention-days: 1
